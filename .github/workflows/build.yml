name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v5
      - name: Fix Dateiname
        run: |
          if [ -f "Project.godot" ] && [ ! -f "project.godot" ]; then
            mv Project.godot project.godot
          fi
          ls -la project.godot
      - name: Setup
        run: |
          rm -rf .godot android
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cd ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* .
          rm -rf templates *.tpz
      - name: Setup Android Build Template
        run: |
          rm -rf android /tmp/android_template
          mkdir -p /tmp/android_template
          unzip -q ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d /tmp/android_template
          mkdir -p android/build
          cp -r /tmp/android_template/* android/build/
          ls -la android/build/
      - name: Setup Godot Settings
        run: |
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which java))))
          mkdir -p ~/.config/godot
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -d "CN=Android Debug,O=Android,C=US" || true
          printf '<?xml version="1.0" encoding="UTF-8" ?>\n<resource>\n<string name="export/android/android_sdk_path">%s</string>\n<string name="export/android/debug_keystore">%s/.android/debug.keystore</string>\n<string name="export/android/debug_keystore_user">androiddebugkey</string>\n<string name="export/android/debug_keystore_pass">android</string>\n<string name="export/android/java_sdk_path">%s</string>\n</resource>\n' "$ANDROID_HOME" "$HOME" "$JAVA_DIR" > ~/.config/godot/editor_settings-4.3.xml
          echo "JAVA_HOME=$JAVA_DIR" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
      - name: Diagnose Was Godot Sieht
        run: |
          echo "=== 1. WAS STEHT IN DEN EDITOR SETTINGS? ==="
          cat ~/.config/godot/editor_settings-4.3.xml
          echo ""
          echo "=== 2. WAS IST ANDROID_HOME / JAVA_HOME? ==="
          echo "ANDROID_HOME=[$ANDROID_HOME]"
          echo "JAVA_HOME=[$JAVA_HOME]"
          echo "HOME=[$HOME]"
          echo ""
          echo "=== 3. EXISTIERT DER ANDROID SDK ORDNER? ==="
          ls -la "$ANDROID_HOME" || echo "ANDROID_HOME EXISTIERT NICHT"
          echo ""
          echo "=== 4. BUILD-TOOLS + PLATFORMS ==="
          ls -la "$ANDROID_HOME/build-tools" || echo "kein build-tools Ordner"
          ls -la "$ANDROID_HOME/platforms" || echo "kein platforms Ordner"
          echo ""
          echo "=== 5. EXISTIERT JAVA? ==="
          ls -la "$(dirname $(dirname $(readlink -f $(which java))))/bin/java" || echo "java nicht gefunden"
          java -version || echo "java -version fehlgeschlagen"
          echo ""
          echo "=== 6. EXISTIERT KEYSTORE? ==="
          ls -lh ~/.android/debug.keystore || echo "keystore fehlt"
          echo ""
          echo "=== 7. WAS STEHT IN project.godot? ==="
          cat project.godot
          echo ""
          echo "=== 8. WAS STEHT IN export_presets.cfg? ==="
          cat export_presets.cfg
          echo ""
          echo "=== 9. TEMPLATE DA? ==="
          ls -lh android/build/build.gradle android/build/config.gradle android/build/gradlew || echo "Template fehlt"
      - name: Build
        timeout-minutes: 20
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          godot --headless --export-debug Android BoballEditor.apk --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: BoballEditor-APK
          path: BoballEditor.apk
