name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        run: |
          rm -rf .godot android
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cd ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* .
          rm -rf templates *.tpz
      - name: Setup Godot Settings
        run: |
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which java))))
          mkdir -p ~/.config/godot
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -d "CN=Android Debug,O=Android,C=US" || true
          printf '<?xml version="1.0" encoding="UTF-8" ?>\n<resource>\n<string name="export/android/android_sdk_path">%s</string>\n<string name="export/android/debug_keystore">%s/.android/debug.keystore</string>\n<string name="export/android/debug_keystore_user">androiddebugkey</string>\n<string name="export/android/debug_keystore_pass">android</string>\n<string name="export/android/java_sdk_path">%s</string>\n</resource>\n' "$ANDROID_HOME" "$HOME" "$JAVA_DIR" > ~/.config/godot/editor_settings-4.3.xml
          echo "JAVA_HOME=$JAVA_DIR" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
      - name: Diagnose Schreibrechte
        run: |
          echo "=== WER BIN ICH, WO BIN ICH ==="
          id
          pwd
          echo "HOME=$HOME"
          echo "=== WAS LIEGT HIER ==="
          ls -la
          echo "=== CHMOD + .godot NEU ==="
          chmod -R 777 .
          rm -rf .godot
          mkdir -p .godot/editor .godot/imported
          chmod -R 777 .godot
          ls -lad .godot .godot/editor .godot/imported
          echo "=== KANN ICH HIER SCHREIBEN? ==="
          touch .godot/editor/filesystem_cache8 && echo "TOUCH filesystem_cache8: OK" || echo "TOUCH filesystem_cache8: FEHLER"
          touch .godot/imported/test.md5 && echo "TOUCH test.md5: OK" || echo "TOUCH test.md5: FEHLER"
          touch test_apk_write.txt && echo "TOUCH im Root: OK" || echo "TOUCH im Root: FEHLER"
          ls -la .godot/editor/ .godot/imported/
          echo "=== MOUNT / PLATTE ==="
          df -h .
          mount | grep -i github || mount | grep workspace || true
      - name: Build
        timeout-minutes: 20
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          godot --headless --export-debug Android BoballEditor.apk --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: BoballEditor-APK
          path: BoballEditor.apk
