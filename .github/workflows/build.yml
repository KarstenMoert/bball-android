name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        run: |
          rm -rf .godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cd ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* .
          rm -rf templates *.tpz
          ls -la
      - name: Build
        timeout-minutes: 15
        run: |
          mkdir -p /root/.android
          keytool -genkey -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -d "CN=Android Debug,O=Android,C=US" || true
          godot --headless --export-debug Android BoballEditor.apk --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: BoballEditor-APK
          path: BoballEditor.apk
